services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: umi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: umi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
